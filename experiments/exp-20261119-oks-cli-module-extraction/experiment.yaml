schema_version: "0.1"
kind: experiment-record
id: "exp-20261119-oks-cli-module-extraction"
title: "把一个 4451 行 CLI 拆成五个模块：五道门全过，且静态扫描抓到一次真实缺陷"
date: "2026-11-19"
type: "controlled-comparison"
status: "completed"
question: "把单体 cli.py 按功能组机械搬出为独立模块后，对外命令面、帮助文本、可观察行为，以及未被执行到的分支，是否都没有漂移？"
hypotheses:
  - "命令树与帮助文本由装饰器和函数签名决定，纯搬迁应零差异。"
  - "失败集合（classname::name）应保持不变；失败条数会因环境漂移，不能作为判据。"
  - "纯搬迁不应改写函数体；AST 逐条比对应 100% 一致。"
  - "仅靠运行时证据会漏掉未执行分支，需要静态全局名扫描补盲。"
evaluation:
  pack_id: "software-cli-refactor-gate"
  pack_version: "0.2.0"
  rubric_version: "0.2"
conditions:
  input_revision: >-
    oks 8761a41（上游 main）。搬迁前 cli/knowledge_studio/cli.py 4451 行；搬迁后 1911 行，
    并新增 hooks.py / hooks_cli.py / instance_cli.py / mail_cli.py / metrics_html.py 五个模块，合计 2774 行。
  environment:
    os: "Windows 11"
    python: "3.14.0（基础解释器；venv launcher 当日全部失效，见 confounders）"
    machine: "单机本地 SSD"
    kb: "不涉及知识库；被测对象是 CLI 代码结构"
  model_configs: []
  workflow_configs:
    - "无 Agent 参与，无 LLM 调用；所有门由脚本判定"
  tools_and_skills:
    - "tools/cli_tree.py"
    - "tools/junit_diff.py"
    - "tools/block_equivalence.py"
    - "tools/module_globals.py"
  budget:
    baseline_wall_clock_seconds: 1000
    optimized_wall_clock_seconds: 934
  controlled_variables:
    - "基线与改后同机器、同解释器、同 pytest 命令、同 PYTHONPATH 顺序（cli 在 site-packages 之前）"
    - "基线为原地换回原始 cli.py 后重跑，不是事后补跑"
    - "所有切片共用一份 160 条命令树基线（records/streamline/cli-tree-before.txt）"
  confounders:
    - "当日所有 venv 的 python.exe 静默 exit 1（含新建 venv），被迫改用基础解释器 + PYTHONPATH，全量套件从 8m45s 变成 15-19m。"
    - "site-packages 里存在旧的 knowledge_studio 安装副本；PYTHONPATH 顺序错误时，hook 子进程会导入旧代码，失败原因被 ModuleNotFoundError 掩盖。"
    - "test_init / test_schema_assets 会在测试期间临时生成 knowledge_studio/_assets，使 4 条 hook 用例在全量套件里“自己好了”，单跑 test_hooks 则失败；测试顺序会系统性掩盖缺陷。"
    - "环境漂移使同一份代码的全量失败数在 14 / 16 / 40 / 5 / 3 / 4 之间变化，因此本记录只使用失败集合与定向运行两类证据。"
runs:
  - id: slice-hook
    group: "B2-1 hook 组"
    revision: "8761a41 + hooks.py, hooks_cli.py"
    command: "python tools/cli_tree.py --repo <repo>/cli | diff <(sort evidence/command-tree-before.txt) -"
    exit_code: 0
    metrics:
      cli_py_lines_before: 4451
      cli_py_lines_after: 3413
      command_tree_entries_before: 160
      command_tree_entries_after: 160
      tree_diff_lines: 0
      undefined_global_names: 1
    evidence: "evidence/command-tree-before.txt"
    note: "本切片所有运行时门全过，但静态扫描发现 hooks_cli.py 少了 `import shlex`（POSIX 分支才会执行）。缺陷在 B2-1 补记中修复。"
  - id: slice-instance
    group: "B2-2 instance 组"
    revision: "8761a41 + instance_cli.py"
    command: "pytest tests --junitxml=after.xml（对照 b2-2-base-20261118.xml）"
    exit_code: 0
    metrics:
      cli_py_lines_after: 2826
      help_invocations: 8
      help_diff_lines: 0
      tests: 1738
      failures_before: 40
      failures_after: 40
      new_failures: 0
      fixed_failures: 0
    evidence: "evidence/help-parity.txt"
  - id: slice-mail
    group: "B2-3 mail + registry 组"
    revision: "8761a41 + mail_cli.py"
    command: "pytest tests --junitxml=b2-3-full-20261119.xml（对照 b2-3-base-20261119.xml）"
    exit_code: 0
    metrics:
      cli_py_lines_after: 2069
      help_invocations: 9
      help_diff_lines: 0
      body_equivalence_checked: 26
      body_equivalence_identical: 26
      undefined_global_names: 0
    evidence: "evidence/body-equivalence.txt"
    note: "本切片期间发生过一次 cli.py 侧漏导入 Path 的事故：命令树 diff 为空，但 --help 抛 NameError。说明命令树门单独不足以判定可运行性。"
  - id: fix-hook-script
    group: "B3-1 hook 引擎路径修复（独立切片）"
    revision: "8761a41 + hooks.py fallback"
    command: "pytest tests/test_hooks.py（定向，修复前后各一次）"
    exit_code: 0
    metrics:
      targeted_failures_before: 5
      targeted_failures_after: 0
      targeted_passed_after: 31
      hook_script_unavailable_after: 0
    evidence: "evidence/junit-diff-combined.txt"
    note: "这是结构切片暴露出的真实缺陷，按规则独立成片，未混入 B2-1。"
  - id: slice-copy-primitive
    group: "B3-2 复制原语合并"
    revision: "8761a41 + 单一 _copy_tree"
    command: "pytest tests/test_init.py tests/test_schema_assets.py tests/test_onboarding_cli.py tests/test_skill_bundle.py"
    exit_code: 0
    metrics:
      instance_cli_lines_before: 654
      instance_cli_lines_after: 663
      targeted_tests: 45
      targeted_failures: 0
    evidence: "evidence/module-globals.txt"
    note: "行为重构而非行数压缩：行数 +9，收益是单一跳过/覆盖/保护规则。"
  - id: slice-metrics-html
    group: "B4-1 metrics HTML 生成器"
    revision: "8761a41 + metrics_html.py"
    command: "pytest tests --junitxml=b4-1-full-20261119.xml（对照 b3-base-20261119.xml）"
    exit_code: 1
    metrics:
      cli_py_lines_before: 2069
      cli_py_lines_after: 1911
      body_equivalence_checked: 1
      body_equivalence_identical: 1
      undefined_global_names: 0
      command_tree_entries_after: 160
      tests: 1738
      failures_before: 5
      failures_after: 4
      new_failures: 0
      fixed_failures: 1
      skipped: 3
    evidence: "evidence/body-equivalence.txt"
    note: "`metrics --html` 没有自动化测试，只能靠 AST 等价 + 冒烟（2218 bytes HTML，含 doctype 与 slug）。"
  - id: combined-regression
    group: "B3-2 + B4-1 组合全量（最终口径）"
    revision: "8761a41 + 五个模块 + B3-1 + B3-2 + B4-1"
    command: "pytest tests --junitxml=b4-1-full-20261119.xml（对照 b3-base-20261119.xml）"
    exit_code: 1
    metrics:
      tests: 1738
      failures_before: 5
      failures_after: 4
      new_failures: 0
      fixed_failures: 1
      skipped: 3
      wall_clock_seconds: 934
    evidence: "evidence/junit-diff-combined.txt"
results:
  summary: >-
    五道门在每一次搬迁上都通过：命令树 160/160 无差异；帮助文本 8 条 + 9 条逐字节相同；
    失败集合 new=0（最终口径 5 → 4，fixed=1）；mail 26 个函数与 metrics HTML 生成器 AST 全部 IDENTICAL；
    六个拆分模块未定义全局名 0。cli.py 从 4451 行降到 1911 行（-57%），五个新模块合计 2774 行，
    因此这是结构拆分而非行数压缩。B3-1 独立修复让 hook 定向测试从 5 failed 变为 31 passed。
  comparison:
    - metric: "cli.py 行数"
      baseline: 4451
      optimized: 1911
      delta: "-2540 (-57.1%)"
    - metric: "命令树条目"
      baseline: 160
      optimized: 160
      delta: "0"
    - metric: "帮助文本 diff 行数"
      baseline: 0
      optimized: 0
      delta: "0"
    - metric: "失败集合新增（最终口径）"
      baseline: 0
      optimized: 0
      delta: "0"
    - metric: "hook 定向测试失败数"
      baseline: 5
      optimized: 0
      delta: "-5"
    - metric: "未定义全局名"
      baseline: 1
      optimized: 0
      delta: "-1"
  deviations:
    - "B2-2 的 40/40 对照是在 venv 解释器下取得；B2-3 的 16/16 对照在“仅 site-packages”的过渡 PYTHONPATH 下取得；两者与最终对照（5/4）不可串比。记录中已按口径分开标注。"
    - "全量套件只能证明被执行的路径没变；B2-1 漏掉 import shlex 正是被静态扫描（而非测试）发现的。"
    - "B3-2 是合并复制逻辑，行数 +9 而非下降；把两处 13 行循环换成一个 30 行原语，收益是单一跳过/覆盖规则，不是行数。"
    - "B4-1 无自动化测试覆盖，等价性只由 AST 与一次冒烟支撑，强度低于有测试的切片。"
  conclusion: "supported"
  confidence: "medium"
evidence:
  raw_data:
    - "evidence/command-tree-before.txt"
    - "evidence/command-tree-after.txt"
    - "evidence/help-instance-before.txt"
    - "evidence/help-instance-after.txt"
    - "evidence/help-mail-before.txt"
    - "evidence/help-mail-after.txt"
  logs:
    - "evidence/help-parity.txt"
    - "evidence/junit-diff-combined.txt"
    - "evidence/body-equivalence.txt"
    - "evidence/module-globals.txt"
  artifact_locations:
    - "oks 仓库 records/streamline/20261118-b2-hooks-module-extraction.md"
    - "oks 仓库 records/streamline/20261118-b2-instance-module-extraction.md"
    - "oks 仓库 records/streamline/20261119-b2-mail-module-extraction.md"
    - "oks 仓库 records/streamline/20261119-b3-hook-script-source.md"
    - "oks 仓库 records/streamline/20261119-b3-2-copy-primitive.md"
    - "oks 仓库 records/streamline/20261119-b4-1-metrics-html-module.md"
  evaluator_notes:
    - "评测由改动者本人在同一上下文执行，不满足 GOVERNANCE §6 对独立评估的要求；confidence 因此为 medium。"
    - "本记录不包含 oks 源码快照，复跑需要 oks 仓库 8761a41 与其工作树；证据只保留可机器判定的计数与 diff 结果。"
    - "失败条数一律不作为判据；只使用 classname::name 集合差集与定向运行结果。"
reproducibility:
  steps:
    - "取 oks 8761a41 作为 BASE，在不改动的前提下采集命令树、帮助文本与全量 junit。"
    - "用 `git show 8761a41:cli/knowledge_studio/cli.py` 导出预拆分快照，作为 body_equivalence 的 BASE_FILE。"
    - "应用搬迁（五个新模块 + cli.py 导入/注册），重复采集三份产物。"
    - "运行 tools/cli_tree.py 与 tools/junit_diff.py，确认 diff 为空、NEW=0。"
    - "运行 tools/block_equivalence.py（BASE 文件 vs 新模块，函数清单见 body-equivalence.txt）确认 27/27 IDENTICAL，委托壳单列。"
    - "运行 tools/module_globals.py 扫描全部六个模块，确认未定义名为 0。"
    - "定向运行 pytest tests/test_hooks.py，确认不再出现 hook_script_unavailable。"
  known_gaps:
    - "只在 Windows 上验证；POSIX 分支的运行时行为未被测试覆盖（shlex 缺陷即此类）。"
    - "安装态（wheel 内 _assets/）行为只做了代码级推理，未实际构建 wheel 复验。"
    - "未在独立执行者/独立上下文中复跑，独立复核仍待做。"
    - "POSIX 分支持续无覆盖；下一次若能在 Linux runner 上跑同一套门，应把结果作为独立 run 追加。"
    - "`metrics --html` 与 `wiki export` 的渲染输出仍无自动化断言，等价性只能靠 AST。"
  replay_status: "not-attempted"
