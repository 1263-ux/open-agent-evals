    - "本记录不包含 oks 源码快照，复跑需要 oks 仓库 8761a41 与其工作树；证据只保留可机器判定的计数与 diff 结果。"
    - "失败条数一律不作为判据；只使用 classname::name 集合差集与定向运行结果。"
reproducibility:
  steps:
    - "取 oks 8761a41 作为 BASE，在不改动的前提下采集命令树、根帮助、各组帮助与全量 junit。"
    - "用 `git show 8761a41:cli/knowledge_studio/cli.py` 导出预拆分快照，作为 body_equivalence 的 BASE_FILE。"
    - "按切片顺序应用搬迁；每片都重新采集命令树与帮助，并跑 `tools/cli_tree.py` / `cmp`。"
    - "每片跑 tools/block_equivalence.py（BASE 文件 vs 新模块，函数清单见 body-equivalence.txt），确认 IDENTICAL 且委托壳单列。"
    - "每片跑 tools/module_globals.py 扫描全部已拆模块，确认未定义名为 0。"
    - "每片跑 tools/junit_diff.py 对基线 junit，确认 NEW=0（不看失败条数）。"
    - "定向运行受影响测试文件；任何失败先判断是产品缺陷还是测试 patch 了错误模块。"
  known_gaps:
    - "只在 Windows 上验证；POSIX 分支的运行时行为未被测试覆盖（shlex 缺陷即此类）。"
    - "安装态（wheel 内 _assets/）行为只做了代码级推理，未实际构建 wheel 复验。"
    - "未在独立执行者/独立上下文中复跑，独立复核仍待做。"
    - "模块级常量/类型别名的搬家只有手工 AST 比对（B4-5 的 _RECALL_YAML_KEYS），工具尚未覆盖；可给 block_equivalence.py 加 --assignments。"
    - "`metrics --html` 与 `wiki export` 的渲染输出无自动化断言，等价性只能靠 AST。"
    - "失败集合对比假设基线与本机环境一致；跨机器复跑时 4 条本机失败可能整体换脸。"
  replay_status: "not-attempted"
