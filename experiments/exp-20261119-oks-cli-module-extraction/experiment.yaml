schema_version: "0.1"
kind: experiment-record
id: "exp-20261119-oks-cli-module-extraction"
title: "把一个 4451 行 CLI 拆成 14 个模块：87 个函数逐字等价，静态扫描抓到 5 处运行时看不见的缺陷"
date: "2026-11-19"
type: "controlled-comparison"
status: "completed"
question: "把单体 cli.py 按功能组机械搬出为独立模块后，对外命令面、帮助文本、可观察行为，以及未被执行到的分支，是否都没有漂移？"
hypotheses:
  - "命令树与帮助文本由装饰器和函数签名决定，纯搬迁应零差异。"
  - "失败集合（classname::name）应保持不变；失败条数会因环境漂移，不能作为判据。"
  - "纯搬迁不应改写函数体；AST 逐条比对应 100% 一致。"
  - "仅靠运行时证据会漏掉未执行分支，需要静态全局名扫描补盲。"
  - "当搬运量超过手工校对可靠区间时，按原文切片（而非重打）能让等价性由构造成立。"
evaluation:
  pack_id: "software-cli-refactor-gate"
  pack_version: "0.2.0"
  rubric_version: "0.2"
conditions:
  input_revision: >-
    oks 8761a41（上游 main）。搬迁前 cli/knowledge_studio/cli.py 4451 行；搬迁后 616 行，
    并新增 14 个模块、合计 4336 行。模块总行数大于搬迁前，因为每个模块都要自己的
    docstring / import 块 / 委托壳 —— 这是结构拆分，不是行数压缩。
  environment:
    os: "Windows 11"
    python: "3.14.0（基础解释器；venv launcher 当日全部失效，见 confounders）"
    machine: "单机本地 SSD"
    kb: "不涉及知识库；被测对象是 CLI 代码结构"
  model_configs: []
  workflow_configs:
    - "无 Agent 参与，无 LLM 调用；所有门由脚本判定"
  tools_and_skills:
    - "tools/cli_tree.py"
    - "tools/junit_diff.py"
    - "tools/block_equivalence.py"
    - "tools/module_globals.py"
  budget:
    baseline_wall_clock_seconds: 1000
    optimized_wall_clock_seconds: 1253
  controlled_variables:
    - "基线与改后同机器、同解释器、同 pytest 命令、同 PYTHONPATH 顺序（cli 在 site-packages 之前）"
    - "基线为原地换回原始 cli.py 后重跑，不是事后补跑"
    - "全部六个切片共用一份 160 条命令树基线与一份根帮助基线"
    - "每片的帮助基线都在改代码之前采集"
  confounders:
    - "当日所有 venv 的 python.exe 静默 exit 1（含新建 venv），被迫改用基础解释器 + PYTHONPATH，全量套件从 8m45s 变成 16-21m。"
    - "site-packages 里存在旧的 knowledge_studio 安装副本；PYTHONPATH 顺序错误时，hook 子进程会导入旧代码，失败原因被 ModuleNotFoundError 掩盖。"
    - "test_init / test_schema_assets 会在测试期间临时生成 knowledge_studio/_assets，使 4 条 hook 用例在全量套件里“自己好了”，单跑 test_hooks 则失败；测试顺序会系统性掩盖缺陷。"
    - "环境漂移使同一份代码的全量失败数在 3 / 4 / 5 / 14 / 16 / 40 之间变化，因此本记录只使用失败集合与定向运行两类证据。"
    - "test_linked_sources 的一条用例走本地 Studio HTTP：服务端已返回 200，客户端 10s 读超时。它在本机频繁触发，与被测 CLI 无关。"
runs:
  - id: slice-hook
    group: "B2-1 hook 组"
    revision: "8761a41 + hooks.py, hooks_cli.py"
    command: "python tools/cli_tree.py --repo <repo>/cli | diff <(sort evidence/command-tree-before.txt) -"
    exit_code: 0
    metrics:
      cli_py_lines_before: 4451
      cli_py_lines_after: 3413
      command_tree_entries: 160
      tree_diff_lines: 0
      undefined_global_names: 1
    evidence: "evidence/command-tree-before.txt"
    note: "本切片所有运行时门全过，但静态扫描发现 hooks_cli.py 少了 `import shlex`（POSIX 分支才会执行）。缺陷在 B3-1 期间修复。"
  - id: slice-instance
    group: "B2-2 instance 组"
    revision: "8761a41 + instance_cli.py"
    command: "pytest tests --junitxml=after.xml（对照 b2-2-base-20261118.xml）"
    exit_code: 0
    metrics:
      cli_py_lines_after: 2826
      help_invocations: 8
      help_diff_bytes: 0
      tests: 1738
      failures_before: 40
      failures_after: 40
      new_failures: 0
      fixed_failures: 0
    evidence: "evidence/help-instance-before.txt"
  - id: slice-mail
    group: "B2-3 mail + registry 组"
    revision: "8761a41 + mail_cli.py"
    command: "pytest tests --junitxml=b2-3-full-20261119.xml（对照 b2-3-base-20261119.xml）"
    exit_code: 0
    metrics:
      cli_py_lines_after: 2069
      help_invocations: 9
      help_diff_bytes: 0
      body_functions_checked: 26
      body_functions_identical: 26
    evidence: "evidence/help-mail-before.txt"
    note: "本切片期间发生过一次新模块漏导入 Path 的事故：命令树 diff 为空，但 --help 抛 NameError。说明命令树门单独不足以判定可运行性。"
  - id: fix-hook-script
    group: "B3-1 hook 引擎路径修复（独立切片）"
    revision: "8761a41 + hooks.py fallback"
    command: "pytest tests/test_hooks.py（定向，修复前后各一次）"
    exit_code: 0
    metrics:
      targeted_failures_before: 5
      targeted_failures_after: 0
      targeted_passed_after: 31
      hook_script_unavailable_after: 0
    evidence: "evidence/junit-diff-combined.txt"
    note: "结构切片暴露出的真实缺陷，按规则独立成片，未混入 B2-1。"
  - id: slice-copy-primitive
    group: "B3-2 复制原语合并"
    revision: "8761a41 + 单一 _copy_tree"
    command: "pytest tests/test_init.py tests/test_schema_assets.py tests/test_onboarding_cli.py tests/test_skill_bundle.py"
    exit_code: 0
    metrics:
      instance_cli_lines_before: 654
      instance_cli_lines_after: 663
      targeted_tests: 45
      targeted_failures: 0
    evidence: "evidence/module-globals.txt"
    note: "行为重构而非行数压缩：行数 +9，收益是单一跳过/覆盖/保护规则。"
  - id: slice-metrics-html
    group: "B4-1 metrics HTML 生成器"
    revision: "8761a41 + metrics_html.py"
    command: "pytest tests --junitxml=b4-1-full-20261119.xml（对照 b3-base-20261119.xml）"
    exit_code: 1
    metrics:
      cli_py_lines_before: 2069
      cli_py_lines_after: 1911
      body_functions_checked: 1
      body_functions_identical: 1
      tests: 1738
      failures_before: 5
      failures_after: 4
      new_failures: 0
    evidence: "evidence/body-equivalence.txt"
    note: "`metrics --html` 没有自动化测试，只能靠 AST 等价 + 一次冒烟（2218 bytes HTML，含 doctype 与 slug）。"
  - id: slice-trace
    group: "B4-2 trace 组"
    revision: "8761a41 + trace_cli.py"
    command: "pytest tests/test_trace.py tests/test_cli.py tests/test_evaluation_feedback.py"
    exit_code: 0
    metrics:
      cli_py_lines_after: 1727
      help_invocations: 10
      help_diff_bytes: 0
      body_functions_checked: 11
      body_functions_identical: 11
      targeted_tests: 56
      new_failures: 0
    evidence: "evidence/help-trace-before.txt"
  - id: slice-wiki
    group: "B4-3 wiki 组"
    revision: "8761a41 + wiki_cli.py"
    command: "pytest tests/test_cli.py tests/test_health.py tests/test_evaluation_feedback.py tests/test_distiller.py"
    exit_code: 0
    metrics:
      cli_py_lines_after: 1439
      help_invocations: 11
      root_help_diff_bytes: 0
      body_functions_checked: 10
      body_functions_identical: 10
      targeted_tests: 61
      new_failures: 0
    evidence: "evidence/help-wiki-before.txt"
    note: >-
      wiki_use 同时挂根 `use` 与 `wiki use` 两个装饰器。新模块只能挂后者，根别名回到 cli.py 用
      `app.command("use")(wiki_cli.wiki_use)` 且必须放在原位置 —— 根 --help 按注册顺序渲染，
      挪到文件末尾会让 `use` 换位，而命令树门照样通过。因此本片把根帮助纳入门。
  - id: slice-fs
    group: "B4-4 fs 组"
    revision: "8761a41 + fs_cli.py"
    command: "pytest tests/test_vfs.py tests/test_vfs_observation.py tests/test_cli.py"
    exit_code: 0
    metrics:
      cli_py_lines_after: 1248
      help_invocations: 9
      help_diff_bytes: 0
      body_functions_checked: 12
      body_functions_identical: 12
      targeted_tests: 98
      new_failures: 0
    evidence: "evidence/help-fs-before.txt"
    note: "`_run_vfs` 是 8 个命令共用的执行通道，签名不变所以命令树/帮助看不出来，只有 AST 等价能守住。"
  - id: slice-drafts-config-sources
    group: "B4-5 drafts + config + sources"
    revision: "8761a41 + drafts_cli.py, config_cli.py, sources_cli.py"
    command: "pytest tests/test_draft_review.py tests/test_daily_sources.py tests/test_cli.py"
    exit_code: 0
    metrics:
      cli_py_lines_after: 1014
      help_invocations: 14
      help_diff_bytes: 0
      body_functions_checked: 11
      body_functions_identical: 11
      assignments_checked: 1
      targeted_tests: 70
      new_failures: 0
    evidence: "evidence/help-drafts-config-sources-before.txt"
    note: "`_RECALL_YAML_KEYS` 常量表随 config_set 搬走。函数级等价门覆盖不到模块级常量，额外做了一次 AST 比对（IDENTICAL）。"
  - id: slice-capability-ingest-eval
    group: "B4-6 capability + ingest + eval"
    revision: "8761a41 + capability_cli.py, ingest_cli.py, eval_cli.py"
    command: "pytest tests/test_cli.py tests/test_optional_extensions.py tests/test_capability_commands.py tests/test_ingest_workflow.py tests/test_evaluation.py tests/test_evaluation_v2.py"
    exit_code: 0
    metrics:
      cli_py_lines_after: 616
      help_invocations: 17
      help_diff_bytes: 0
      body_functions_checked: 16
      body_functions_identical: 16
      undefined_global_names_first_pass: 5
      undefined_global_names_after_fix: 0
      targeted_tests_failed_first_pass: 14
      targeted_tests: 185
      new_failures: 0
    evidence: "evidence/help-capability-ingest-eval-before.txt"
    note: >-
      本片改用程序化提取原文（按 marker 切片），~390 行 16 个函数不再手打，等价性由构造成立。
      静态门抓到 5 个未定义名（t×2、re、_capability_already_installed、_extractor_env_for），
      它们全部不会让命令树/帮助报错，只在执行到那条分支时炸。
  - id: combined-regression
    group: "全部六片组合全量（最终口径）"
    revision: "8761a41 + 14 个模块 + B3-1 + B3-2"
    command: "pytest tests --junitxml=b4-6-full-20261119.xml（对照 b3-base-20261119.xml）"
    exit_code: 1
    metrics:
      tests: 1738
      failures_before: 5
      failures_after: 4
      new_failures: 0
      fixed_failures: 1
      skipped: 3
      wall_clock_seconds: 1253
    evidence: "evidence/junit-diff-combined.txt"
results:
  summary: >-
    五道门在每一次搬迁上都通过：命令树 160/160 无差异；79 次帮助调用（8+9+10+11+9+14+17）加根帮助
    全部逐字节相同；每个切片相对基线的失败集合 new=0；87 个被搬动的函数 AST 全部 IDENTICAL；
    15 个模块未定义全局名 0。cli.py 从 4451 行降到 616 行（-86.2%），14 个模块合计 4336 行 ——
    模块总量比原文件更大，这是结构拆分而非行数压缩。B3-1 独立修复让 hook 定向测试从 5 failed 变为 31 passed。
  comparison:
    - metric: "cli.py 行数"
      baseline: 4451
      optimized: 616
      delta: "-3835 (-86.2%)"
    - metric: "命令树条目"
      baseline: 160
      optimized: 160
      delta: "0"
    - metric: "帮助文本 diff 字节（79 次调用 + 根帮助）"
      baseline: 0
      optimized: 0
      delta: "0"
    - metric: "失败集合新增（每片对基线）"
      baseline: 0
      optimized: 0
      delta: "0"
    - metric: "AST 等价的被搬函数"
      baseline: 0
      optimized: 87
      delta: "+87"
    - metric: "未定义全局名"
      baseline: 1
      optimized: 0
      delta: "-1"
    - metric: "hook 定向测试失败数"
      baseline: 5
      optimized: 0
      delta: "-5"
  deviations:
    - "B2-2 的 40/40 对照是在 venv 解释器下取得；B2-3 的 16/16 对照在“仅 site-packages”的过渡 PYTHONPATH 下取得；其余片在最终口径下取得。三者不可串比，记录中按口径分开标注。"
    - "全量套件只能证明被执行的路径没变；B2-1 的 shlex 与 B4-6 的 5 个未定义名都是静态扫描发现的。"
    - "B3-2 是合并复制逻辑，行数 +9 而非下降；收益是单一跳过/覆盖规则，不是行数。"
    - "B4-1 无自动化测试覆盖，等价性只由 AST 与一次冒烟支撑，强度低于其它切片。"
    - "B4-6 的定向测试首轮 14 failed 全部来自测试 patch 了错误的模块（定义方 vs 调用方），不是产品缺陷；修引用后 185 passed。"
  conclusion: "supported"
  confidence: "medium"
