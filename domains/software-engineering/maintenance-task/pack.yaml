    - "Maven"
    - "Preserve the public method signature"
    - "Do not modify the acceptance test to make the task pass"
    - "Keep the change limited to the calculation defect"
  out_of_scope:
    - "Adding new discount types"
    - "Changing input validation policy"
    - "Refactoring unrelated code"
