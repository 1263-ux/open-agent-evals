    path: "rubric.yaml"
    version: "0.1"
  hard_constraints:
    - "The acceptance test for discounted subtotal plus full shipping passes."
    - "The existing no-discount test passes."
    - "The public API remains unchanged."
    - "The acceptance test is not weakened or deleted."
  failure_conditions:
    - "Discount is still applied to shipping."
    - "The test is altered instead of fixing production code."
    - "Unrelated behavior or public API is changed."
  evaluator:
    modes: ["automated", "human"]
    independence_required: true
execution:
