rubric_version: "0.2"
scale:
  0: "No inspectable artifact"
  1: "Gate not run, or run against a baseline that was itself modified"
  2: "Gate run but evidence is indirect (counts, spot checks, screenshots)"
  3: "Gate run against a clean baseline with machine-checkable evidence"
  4: "Meets 3 and the gate is reproducible by a third party from the recorded commands"
dimensions:
  - id: command_tree_integrity
    hard_gate: true
    evidence_required: true
    tool: "tools/cli_tree.py"
    anchors:
      0: "No tree dump"
      1: "Tree dumped from the modified tree only"
      2: "Tree compared manually or partially"
      3: "Sorted line diff between baseline and post-change tree is empty"
      4: "Meets 3 and the dump is regenerated by a second party with the same result"
  - id: help_text_parity
    hard_gate: true
    evidence_required: true
    tool: "shell + diff"
    anchors:
      0: "No help capture"
      1: "Help captured for a subset of moved groups"
      2: "Help compared by eye or normalised before diffing"
      3: "Help captured for every moved group, byte-identical"
      4: "Meets 3 and includes root help plus nested subcommands"
  - id: failure_set_parity
    hard_gate: true
    evidence_required: true
    tool: "tools/junit_diff.py"
    anchors:
      0: "No test run"
      1: "Failure count compared instead of the failure set"
      2: "Failure set compared across mismatched interpreters or commands"
      3: "Failure set diff shows NEW=0 under matched conditions"
      4: "Meets 3 and FIXED entries are explained rather than ignored"
  - id: body_equivalence
    hard_gate: true
    evidence_required: true
    tool: "tools/block_equivalence.py"
    anchors:
      0: "No comparison"
      1: "Only a sample of moved functions checked"
      2: "Text diff used, so reindentation counts as a change"
      3: "Every claimed-moved function is AST-identical"
      4: "Meets 3 and deliberate delegation shims are listed separately from moved code"
  - id: static_resolution
    hard_gate: true
    evidence_required: true
    tool: "tools/module_globals.py"
    anchors:
      0: "Static scan not run"
      1: "Scan limited to the module that was edited"
      2: "Scan run but undefined names left unexplained"
      3: "All refactored modules scanned, undefined global names = 0"
      4: "Meets 3 and the scan set is recorded so coverage cannot silently shrink"
  - id: slice_isolation
    hard_gate: false
    evidence_required: true
    anchors:
      0: "One giant change with no attribution"
      1: "Slices overlap, so a regression cannot be attributed"
      2: "Slices declared but not verified independently"
      3: "Each slice has its own gate evidence"
      4: "Meets 3 and slices are ordered so each is revertible on its own"
hard_gates:
  - "command_tree_integrity >= 3"
  - "help_text_parity >= 3"
  - "failure_set_parity >= 3"
  - "body_equivalence >= 3"
  - "static_resolution >= 3"
notes:
  - "A hard gate at < 3 fails the whole slice regardless of the other dimensions."
  - "Failure counts are treated as an observation about the environment, never as a quality signal."
  - "`slice_isolation` is advisory: it affects confidence, not pass/fail."
  - "No weighted total score; cost is reported separately from correctness."
